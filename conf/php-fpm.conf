# PHP over FastCGI — **not loaded by default**.
#
# This image contains no PHP. It expects the sibling `morsalin1342/php` image
# running php-fpm in another container, and this file is how Apache reaches it.
#
# To turn it on, add one line to your httpd.conf or mount over it:
#
#     Include conf/extra/php-fpm.conf
#
# Or, in a compose file, mount your own vhost that includes it. Nothing here is
# enabled for you, for the same reason nothing else in this image is switched on
# speculatively: an image that quietly proxies to a container you have not
# started fails on the first dynamic request with an error naming something you
# never configured.
#
# Both containers must mount the application at the *same path*. Apache maps a
# URL to a file path and hands that path to php-fpm, which opens it itself — so
# a mismatch produces "Primary script unknown", php-fpm looking for a file that
# exists only in the other container.

# ─────────────────────────────────────────────────────────────────────────────

# SetHandler inside FilesMatch, not ProxyPassMatch.
#
# The difference matters and is easy to get wrong. ProxyPassMatch matches on the
# *request* URI, so a request for a directory — `/` or `/admin/` — never
# resolves to its index.php and returns a 403 or a listing instead. SetHandler
# runs after Apache has mapped the URI onto a file, so DirectoryIndex has
# already done its work.
#
# `proxy:fcgi://php:9000` names the sibling php-fpm container. Override the host
# in your own configuration if you call the service something else; the port is
# php-fpm's default and the php image's www.conf uses it.
#
# The trailing `/var/www/html` on the handler is deliberate: it tells mod_proxy
# the document root to resolve SCRIPT_FILENAME against. Without it php-fpm
# receives a path it cannot open and answers "Primary script unknown", which is
# the single most common failure of this arrangement.
# Grant what app-server.conf denied, and hand it to php-fpm.
#
# The base configuration refuses .php outright, because an image with no PHP
# that serves .php as text is a source-disclosure bug. This section is included
# after it, so its Require wins — which is what makes enabling PHP one line
# rather than a base configuration edit.
<FilesMatch "\.php$">
    Require all granted
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>

# Do not hand a partially-uploaded or non-existent script to PHP.
#
# Without this, a request for a .php file that does not exist is still proxied,
# and php-fpm answers "Primary script unknown" with a 200 in some
# configurations. This turns it into Apache's own 404, which is both correct and
# what a monitoring system can read.
<Directory /var/www/html>
    <FilesMatch "\.php$">
        <If "!-f %{REQUEST_FILENAME}">
            Require all denied
        </If>
    </FilesMatch>
</Directory>
