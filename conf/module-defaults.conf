# Defaults for modules this image ships but does not load.
#
# Every block here is wrapped in <IfModule>, so the whole file is inert until
# somebody runs a2enmod. That is the point: Apache refuses to start on a
# directive belonging to a module that is not loaded ("Invalid command
# 'SSLSessionCache'"), so an unguarded default would turn an optional module
# into a mandatory one.
#
# # What belongs in here, and what does not
#
# Only settings that Apache itself asks for — a module that logs a warning or
# an error at startup until it is configured. Nothing that changes what the
# server *does*.
#
# The distinction matters. Enabling mod_deflate should not silently start
# compressing responses because this file decided that was sensible; somebody
# reading their own configuration would have no idea where it came from. But
# enabling mod_ssl should not print a warning at every start that the operator
# then has to go and research. The first is a behaviour change, the second is
# homework this image can do once for everyone.
#
# Measured, not assumed: every module in the image was enabled on its own and
# started in the foreground. Exactly one logs anything when left unconfigured.

<IfModule ssl_module>
    # AH01873: Init: Session Cache is not configured [hint: SSLSessionCache]
    #
    # mod_ssl logs this at every single start without it, and it is not merely
    # noise — with no session cache, every connection performs a full handshake,
    # including every resumed one. On a busy site that is the difference between
    # a few percent of a core and a visible chunk of it.
    #
    # Loading mod_socache_shmcb is not enough on its own; the warning is about
    # the directive, not the provider. a2enmod pulls the provider in when you
    # enable ssl (see moddeps.sh) and this supplies the directive, so
    # `a2enmod ssl` gives a clean start rather than a warning to look up.
    #
    # 512000 bytes is Apache's own documented example and holds roughly 4000
    # sessions. The nested guard is deliberate: shmcb is a provider name, and
    # naming a provider that is not loaded is a startup failure rather than a
    # warning — strictly worse than what we came here to fix.
    <IfModule socache_shmcb_module>
        SSLSessionCache        "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
        SSLSessionCacheTimeout 300
    </IfModule>
</IfModule>
