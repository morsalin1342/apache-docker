# .htaccess support — **not loaded by default**.
#
# app-server.conf sets `AllowOverride None`, so Apache ignores .htaccess files.
# This file turns them on for the document root:
#
#     a2enconf htaccess
#
# a2enconf appends the Include to httpd.conf after app-server.conf, so this
# <Directory> section is merged after the one there and wins.
#
# What it costs: Apache then looks for .htaccess in every directory on the path
# of every request, and anything that can write into the document root can
# change how the server handles requests there. That second point is why it is
# off by default, and why this list stops short of `AllowOverride All`:
#
#   AuthConfig  Auth* and Require, for a password-protected directory
#   FileInfo    RewriteEngine/RewriteRule, Header, ErrorDocument, AddType and
#               the rest of what application .htaccess files mostly contain
#   Indexes     DirectoryIndex, ExpiresByType and similar
#   Limit       the old Order/Allow/Deny access directives
#   Options     only the options listed, so a .htaccess file can switch
#               symlinks, MultiViews and Indexes, but cannot turn on ExecCGI
#               or server-side includes
<Directory /var/www/html>
    AllowOverride AuthConfig FileInfo Indexes Limit Options=FollowSymLinks,SymLinksIfOwnerMatch,MultiViews,Indexes
</Directory>
