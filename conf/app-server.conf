# The base configuration: Apache serving static files.
#
# Included from httpd.conf. **This is a static web server by default** — there is
# no PHP in this image, so a container started with no configuration of your own
# serves HTML and nothing else. That is the honest default: proxying .php to a
# host called `php` that may not exist would make a stock `docker run` fail on
# the first dynamic request, with an error naming a container the user never
# asked for.
#
# PHP is one line away, and it is `conf/extra/php-fpm.conf` — shipped, loaded by
# nothing. See the top of that file.

# ─────────────────────────────────────────────────────────────────────────────
# Where the application is
# ─────────────────────────────────────────────────────────────────────────────

ServerName localhost
DocumentRoot /var/www/html

<Directory /var/www/html>
    # AllowOverride None.
    #
    # This is the setting people will be most surprised by, since .htaccess
    # support is a common reason to choose Apache at all. Two reasons it is off:
    #
    # Reading .htaccess costs a stat() of every directory on every request, for
    # every request — Apache's own documentation calls it a performance hit and
    # recommends against it "when you have access to httpd main server config".
    # In a container you always do: the configuration is a mounted file.
    #
    # And it is a security boundary. With it on, anything that can write into
    # the document root can change the server's configuration — which for a PHP
    # application means an upload bug becomes a configuration bug.
    #
    # Turn it on for one directory if an application genuinely needs it:
    #   <Directory /var/www/html/some-app>
    #       AllowOverride FileInfo Options=Indexes
    #   </Directory>
    AllowOverride None

    # No directory listings, and no CGI execution outside the fcgi handler.
    Options -Indexes -ExecCGI +FollowSymLinks
    Require all granted
</Directory>

# Refuse .php outright, because this image cannot execute it.
#
# **Without this the default is a source-disclosure bug.** Apache has no PHP
# here, so a .php file matches no handler and mod_mime serves it as plain text:
# a stock container with a PHP application in its document root returns
# config.php — database password included — with a 200. Measured before this
# rule existed.
#
# Refusing is the only safe default. Serving the source of a file the server
# cannot run is never what anybody wanted, and 403 rather than 404 because the
# file genuinely is there and this is a configuration problem the operator
# should see rather than a missing page.
#
# conf/extra/php-fpm.conf overrides this — its own <FilesMatch> comes later and
# grants what this denies, which is the whole reason PHP support is one Include
# line.
<FilesMatch "\.(php|phar|phtml|php[0-9])$">
    Require all denied
</FilesMatch>

# index.html first, because this image serves static files unless told
# otherwise. index.php is still listed: it costs nothing when PHP is off (the
# file simply is not there, and Apache moves on) and means enabling php-fpm.conf
# is genuinely one line rather than two.
DirectoryIndex index.html index.php

# ─────────────────────────────────────────────────────────────────────────────
# Behind a reverse proxy
# ─────────────────────────────────────────────────────────────────────────────

# The client's address, not the proxy's.
#
# Without this every access log line and every application that reads
# REMOTE_ADDR sees the gateway. That breaks rate limiting, audit logs, geoIP,
# and any application that shows "last login from".
#
# **RemoteIPTrustedProxy, not RemoteIPHeader alone.** The header is trivially
# forged by a client, so it must only be believed from an address you trust.
# The ranges below are the private ones Docker allocates from; narrow them to
# your gateway's actual address if you can.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 10.0.0.0/8
RemoteIPTrustedProxy 172.16.0.0/12
RemoteIPTrustedProxy 192.168.0.0/16

# Log the real client address rather than the proxy's, now that we have it.
# %a rather than %h is the whole point of loading mod_remoteip above.
#
# %I and %O are bytes received and sent including headers, which mod_logio
# supplies — %b alone is the response body only, so it under-reports every
# request and cannot see a compressed response's real size at all.
LogFormat "%a %l %u %t \"%r\" %>s %b %I %O \"%{Referer}i\" \"%{User-Agent}i\"" proxied
CustomLog /proc/self/fd/1 proxied

# ─────────────────────────────────────────────────────────────────────────────
# Compression
# ─────────────────────────────────────────────────────────────────────────────

# gzip on the types that benefit, which is the list of things that are text.
#
# By type rather than by extension, because the response may come from php-fpm
# and have no extension to look at — `AddOutputFilterByType` reads the
# Content-Type Apache is about to send, so it covers a proxied application's
# JSON the same way it covers a static .css file.
#
# What is deliberately absent from the list: images, video, fonts (woff2 is
# already compressed), and archives. Compressing them costs CPU and typically
# makes them slightly larger. image/svg+xml is the exception, because SVG is XML.
#
# Guarded, so removing the module with a2dismod leaves a config that still parses.
<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css
    AddOutputFilterByType DEFLATE text/javascript application/javascript
    AddOutputFilterByType DEFLATE application/json application/xml
    AddOutputFilterByType DEFLATE application/rss+xml application/atom+xml
    AddOutputFilterByType DEFLATE image/svg+xml application/wasm
</IfModule>

# ─────────────────────────────────────────────────────────────────────────────
# Not advertising what we are
# ─────────────────────────────────────────────────────────────────────────────

ServerTokens Prod
ServerSignature Off
TraceEnable Off
