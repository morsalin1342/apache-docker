name: Docker Publish

on:
  push:
    branches: [ "master" ]
    paths:
      - 'Dockerfile'
      - 'conf/**'
      # scripts/ is baked into the image — a2enmod and the shared dependency
      # table ship in it, so a change here changes the artifact and must
      # rebuild. Leaving it out is a silent no-op release.
      - 'scripts/**'
      - 'README.md'
      - 'README.dockerhub.md'
      - 'README.dockerhub-org.md'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/apache-docker'
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Extract httpd version from Dockerfile
        id: get_version
        run: |
          # The version lives in an ARG, not a FROM line: the image is
          # `FROM httpd:${HTTPD_VERSION}`, so grepping FROM would return the
          # literal placeholder rather than a version.
          VERSION=$(grep -oP '^ARG HTTPD_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' Dockerfile | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from Dockerfile."
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # The main-server image: Apache facing clients. Default target, so the
      # unsuffixed tags are the ones most people will pull.
      - name: Build and push (main server)
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          push: true
          tags: |
            morsalin1342/apache:${{ steps.get_version.outputs.version }}
            morsalin1342/apache:latest
            easydigital/apache:${{ steps.get_version.outputs.version }}
            easydigital/apache:latest
          # Enable GHA caching for faster builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The origin image: Apache behind a reverse proxy that terminates TLS.
      #
      # A second build rather than a second Dockerfile — `server` is built FROM
      # `origin`, so every layer here is already in the cache from the step
      # above and this costs one config edit and one startup check.
      #
      # There is deliberately no `-origin` floating alongside `latest`: the
      # unsuffixed tags mean "main server", and someone typing `apache:latest`
      # should get the image that works when Apache is the thing clients reach.
      - name: Build and push (origin)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: origin
          push: true
          tags: |
            morsalin1342/apache:${{ steps.get_version.outputs.version }}-origin
            morsalin1342/apache:origin
            easydigital/apache:${{ steps.get_version.outputs.version }}-origin
            easydigital/apache:origin
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Interim scanning (planning: TASK-0008, Q-150), until the Cloud Build pipeline exists: after the push,
      # a fixable critical vulnerability fails the run, and an SPDX SBOM is kept as a workflow artifact.
      - name: Scan the pushed image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easydigital/apache:${{ steps.get_version.outputs.version }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Write the SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easydigital/apache:${{ steps.get_version.outputs.version }}
          format: spdx-json
          output: sbom.spdx.json
          exit-code: '0'

      - name: Keep the SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-apache-server-${{ steps.get_version.outputs.version }}
          path: sbom.spdx.json

      - name: Scan the pushed origin image for fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easydigital/apache:${{ steps.get_version.outputs.version }}-origin
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Write the origin SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: easydigital/apache:${{ steps.get_version.outputs.version }}-origin
          format: spdx-json
          output: sbom.spdx.json
          exit-code: '0'

      - name: Keep the origin SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-apache-origin-${{ steps.get_version.outputs.version }}
          path: sbom.spdx.json

  update_readme:
    # This job runs only after build_and_publish has succeeded.
    needs: build_and_publish
    runs-on: ubuntu-latest
    if: github.repository == 'morsalin1342/apache-docker'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Update Docker Hub description (personal repo)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: morsalin1342/apache
          readme-filepath: ./README.dockerhub.md
          short-description: 'Apache as a static server or php-fpm application server — no PHP inside'

      - name: Update Docker Hub description (org repo)
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: easydigital/apache
          readme-filepath: ./README.dockerhub-org.md
          short-description: 'Apache as a static server or php-fpm application server — no PHP inside'
